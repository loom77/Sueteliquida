<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Primy">
  <defs>
    <linearGradient id="surface" x1="64" y1="28" x2="454" y2="484" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#F7FCF9"/>
      <stop offset="1" stop-color="#EAF7F1"/>
    </linearGradient>
    <linearGradient id="owl" x1="122" y1="96" x2="390" y2="394" gradientUnits="userSpaceOnUse">
      <stop stop-color="#78C998"/>
      <stop offset="0.52" stop-color="#2E9D6C"/>
      <stop offset="1" stop-color="#0B7049"/>
    </linearGradient>
    <linearGradient id="ball" x1="206" y1="310" x2="302" y2="445" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79D39D"/>
      <stop offset="0.48" stop-color="#2FA66F"/>
      <stop offset="1" stop-color="#087147"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#075438" flood-opacity="0.14"/>
    </filter>
    <filter id="ballShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#075438" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="18" y="18" width="476" height="476" rx="112" fill="url(#surface)" stroke="#D9EEE3" stroke-width="5" filter="url(#shadow)"/>

  <!-- warm possibility spark -->
  <path d="M256 55c6 22 17 33 39 39-22 6-33 17-39 39-6-22-17-33-39-39 22-6 33-17 39-39Z" fill="#FFD052"/>

  <!-- friendly owl silhouette -->
  <path d="M109 165c32 7 67-4 91-32 15-17 31-27 56-32 25 5 41 15 56 32 24 28 59 39 91 32-13 22-27 38-46 49 8 23 12 47 12 72 0 87-49 146-113 146s-113-59-113-146c0-25 4-49 12-72-19-11-33-27-46-49Z" fill="url(#owl)"/>

  <!-- white face, deliberately rounded and non-threatening -->
  <path d="M256 156c-37-31-97-18-113 31-16 49 19 101 75 108 15 2 27-2 38-10 11 8 23 12 38 10 56-7 91-59 75-108-16-49-76-62-113-31Z" fill="#FFFEFA"/>

  <!-- mint eye pads -->
  <ellipse cx="205" cy="224" rx="48" ry="51" fill="#E5F7ED"/>
  <ellipse cx="307" cy="224" rx="48" ry="51" fill="#E5F7ED"/>

  <!-- eyes -->
  <circle cx="207" cy="226" r="27" fill="#075438"/>
  <circle cx="305" cy="226" r="27" fill="#075438"/>
  <circle cx="215" cy="216" r="8" fill="#FFFFFF"/>
  <circle cx="313" cy="216" r="8" fill="#FFFFFF"/>
  <circle cx="199" cy="239" r="4" fill="#2E9D6C" opacity="0.5"/>
  <circle cx="297" cy="239" r="4" fill="#2E9D6C" opacity="0.5"/>

  <!-- beak -->
  <path d="M256 253 281 277 256 298 231 277 256 253Z" fill="#FFD052"/>

  <!-- integrated lottery ball: it is the lower body, not an attached sticker -->
  <circle cx="256" cy="369" r="75" fill="url(#ball)" stroke="#F8FFFB" stroke-width="8" filter="url(#ballShadow)"/>
  <ellipse cx="233" cy="342" rx="25" ry="13" fill="#FFFFFF" opacity="0.28" transform="rotate(-24 233 342)"/>
  <text x="256" y="391" text-anchor="middle" font-family="Sora, Inter, Arial Rounded MT Bold, sans-serif" font-size="91" font-weight="800" fill="#FFFFFF">7</text>

  <!-- small signature spark -->
  <path d="M406 337c5 18 14 27 32 32-18 5-27 14-32 32-5-18-14-27-32-32 18-5 27-14 32-32Z" fill="#FFD052"/>
</svg>