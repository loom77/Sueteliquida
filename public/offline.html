<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Primy · Offline</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0f172a;background:#f8fafc}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    main{max-width:520px;background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:28px}
    h1{margin:0;font-size:28px}p{line-height:1.6;color:#475569}button{min-height:44px;border:0;border-radius:12px;background:#0f172a;color:#fff;font-weight:800;padding:0 18px;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <h1>Sei offline</h1>
    <p>Le giocate già salvate e la generazione locale possono continuare a funzionare dall’app installata. Per aggiornare estrazioni e verificare risultati serve una connessione.</p>
    <button type="button" onclick="location.reload()">Riprova</button>
  </main>
</body>
</html>
